tema: herramientas
stack: node-express
pregunta: ¿Con qué herramientas se ejecutan las pruebas, el lint, la compilación y la auditoría de dependencias?
opciones:
  - id: jest-eslint-npm-audit
    nombre: Jest + ESLint + npm audit
    implica: >-
      Comandos de la política. Pruebas: npm test (con "test": "jest" en package.json). Lint:
      npx eslint . Build: npm run build, si el proyecto compila TypeScript (tsc). Auditoría:
      npm audit --audit-level=high, que devuelve error solo desde esa gravedad.
    comandos:
      pruebas: "npm test"
      lint: "npx eslint ."
      build: "npm run build"
    pros:
      - Jest incluye ejecutor, aserciones y mocks en un solo paquete.
      - ESLint tiene reglas para casi cualquier estilo y plugins para TypeScript.
      - npm audit ya viene con npm; no hay que instalar nada más.
    contras:
      - Con módulos ES (import/export) Jest exige configuración adicional.
      - ESLint no formatea el código; si se quiere formato hace falta otra herramienta.
      - npm audit solo cubre lo que está en el lockfile de npm.
    docs: https://jestjs.io/docs/getting-started
    revisado: 2026-11-10
  - id: vitest-biome-pnpm-audit
    nombre: Vitest + Biome + pnpm audit
    implica: >-
      Comandos de la política. Pruebas: vitest run (ejecuta una vez y termina, sin modo vigilante).
      Lint: npx biome check . Build: pnpm build, si el proyecto compila TypeScript. Auditoría:
      pnpm audit --audit-level high. Exige usar pnpm como gestor de paquetes.
    comandos:
      pruebas: "vitest run"
      lint: "npx biome check ."
      build: "pnpm build"
    pros:
      - Biome hace el lint y el formato con una sola herramienta.
      - Vitest entiende módulos ES y TypeScript sin configuración extra.
    contras:
      - Biome admite menos plugins de terceros que ESLint.
      - Cambiar a pnpm obliga a todo el equipo y a la CI a usarlo.
      - Cambia a la vez el ejecutor de pruebas, el lint y el gestor de paquetes respecto a la opción anterior.
    docs: https://vitest.dev/guide/
    revisado: 2026-11-10
