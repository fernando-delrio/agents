<rect width="900" height="270" rx="10" fill="#17271f"/>
<text x="16" y="28" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#50fa7b" letter-spacing="1">SI EL CLIENTE PIDE PRUEBAS, RECIBE ESTO</text>
<g transform="translate(40 96)"><g class=""><use href="#sprite-client"/></g></g>
<rect x="136" y="44" width="748" height="210" rx="6" fill="#23241c" stroke="#f1fa8c" stroke-width="2"/>
<text x="158" y="76" font-family="ui-monospace, Consolas, monospace" font-size="15" class="line line0"><tspan fill="#f1fa8c" font-weight="bold">INFORME DE ENTREGA — Tienda online · pieza «pago»</tspan></text>
<text x="158" y="100" font-family="ui-monospace, Consolas, monospace" font-size="15" class="line line1"><tspan fill="#f8f8f2" font-weight="normal">Lo pidió: la lead, ticket #42</tspan></text>
<text x="158" y="124" font-family="ui-monospace, Consolas, monospace" font-size="15" class="line line2"><tspan fill="#f8f8f2" font-weight="normal">Lo hizo: programador + IA (modelo anotado)</tspan></text>
<text x="158" y="148" font-family="ui-monospace, Consolas, monospace" font-size="15" class="line line3"><tspan fill="#f8f8f2" font-weight="normal">Filtro automático: </tspan><tspan fill="#50fa7b" font-weight="normal">seguridad ✓ · pruebas ✓ · dependencias ✓</tspan></text>
<text x="158" y="172" font-family="ui-monospace, Consolas, monospace" font-size="15" class="line line4"><tspan fill="#f8f8f2" font-weight="normal">Detectado y corregido antes de entregar: </tspan><tspan fill="#ff5555" font-weight="normal">fallo en el cobro</tspan></text>
<text x="158" y="196" font-family="ui-monospace, Consolas, monospace" font-size="15" class="line line5"><tspan fill="#f8f8f2" font-weight="normal">Revisado por una persona: sí, el revisor, jueves 11:40</tspan></text>
<text x="158" y="220" font-family="ui-monospace, Consolas, monospace" font-size="15" class="line line6"><tspan fill="#f8f8f2" font-weight="normal">Aprobado por: la lead · Huella del cambio: a1b2c3d</tspan></text>
</svg>
