<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="titulo">
<title id="titulo">Si el cliente pide pruebas, recibe un informe de la pieza del pago: quién la pidió, quién la hizo y con qué modelo, el resultado del filtro automático, el fallo corregido antes de entregar, quién la revisó, quién la aprobó y la huella del cambio.</title>
<style>
text{white-space:pre}
.belt{animation:belt .4s linear infinite}
.belt-slow{animation:belt 1.2s linear infinite}
@keyframes belt{from{transform:translateX(0)}to{transform:translateX(24px)}}
.bob{animation:bob 1.6s steps(1) infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

.line{animation:appear .6s ease-out both}
.line0{animation-delay:0.3s}.line1{animation-delay:0.8s}.line2{animation-delay:1.3s}.line3{animation-delay:1.8s}.line4{animation-delay:2.3s}.line5{animation-delay:2.8s}.line6{animation-delay:3.3s}
@keyframes appear{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
